[cli]
commit = "0000000000000000000000000000000000000000"
url = "https://github.com/apexJCL/xboxrecomp-cli.git"

[toolkit]
url = "https://github.com/apexJCL/xboxrecomp.git"
branch = "blinx2/portability"
commit = "6d51fa2d2b9eae4a31b22022925c6e72ad14dd04"

[toolchain]
llvm_mingw = "20260922"
nsis = "3.13"
sdl3 = "3.4.18"

[pipeline]
game_name = "cat"
gen = "src/recomp/gen"
out = "analysis"
seeds = ["config/seed_functions.json"]
icall_seeds = true
spin_waits = "config/spin_waits.json"
exclude_manual = "src/recomp_manual.c"
split = 250
names_hooks = ["scripts/host_reserved_names.py"]
ghidra = true

[pipeline.disasm]
text_only = true
extra_sections = ["D3D", "D3DX", "XGRPH", "DSOUND", "PSFD_I", "PSFD_B", "PSFD_P", "PSFD00", "SRCADV", "SRCED", "SRCAC", "XPP"]

[build]
exe = "cat_recomp"
targets = ["windows", "macos"]
windows_dir = "build-win"
macos_dir = "build"
# Passed on every packaging configure so a cache cannot keep a non-stock
# value; nonstock_vars are what package refuses without --allow-nonstock.
stock_cmake = ["-DXBOXRECOMP_ENHANCE=ON", "-UCAT_GEN_OPT"]
nonstock_vars = ["CAT_GEN_OPT"]
icon_var = "CAT_APP_ICON"

[data]
game_files = "game_files"
game_files_exclude = ["default_analysis.json", "UDATA", "TDATA"]
reference_files = 485
dir_env = "BLINX2_DATA_DIR"
windows = "%LOCALAPPDATA%\\BLiNX2"
steamos = "~/Games/BLiNX2"
macos = "~/Library/Application Support/BLiNX2"

[input]
script_env = "RECOMP_INPUT_SCRIPT"
presets = ["@attract", "@stage1", "@stage1-enemies", "@story-hub", "@story-load"]

[golden]
json = "analysis/golden/golden.json"
frames = "analysis/golden/frames"
audio = "analysis/golden/audio.json"
# The game's own enhancement keys at their stock values (cat docs/env.md):
# a golden run showing another value is not a stock run.
enhance_stock = { "fps.mode" = "lock30", "fx.glow" = "on", "fx.glow_intensity" = "1" }

[package]
app = "BLiNX2"
product = "blinx2-recomp"
targets = ["windows", "steamos", "macos"]
brew = ["sdl3", "openssl", "libepoxy"]
content = "packaging"
templates = "packaging"
icon = "xbe"

[bench]
remote_name = ""
main_branch = "main"
toolkit_branch = "posix-host/portability"
toolkit_tests = true
pacing_scenario = "stage1"
